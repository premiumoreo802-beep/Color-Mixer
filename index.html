<!DOCTYPE html>
<html>
<head>
<title>Color Mixer</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
margin-top:60px;
}

.card{
background:#222;
width:320px;
margin:auto;
padding:20px;
border-radius:15px;
}

input{
width:100%;
height:50px;
margin:10px 0;
border:none;
}

button{
width:100%;
padding:12px;
background:#00bfff;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.result{
margin-top:20px;
padding:20px;
border-radius:10px;
}
</style>

</head>
<body>

<div class="card">

<h1> Color Mixer and @Gurvbpro likes men </h1>

<form method="POST">

<input type="color" name="color1" value="{{color1}}">

<input type="color" name="color2" value="{{color2}}">

<button>Mix Colors</button>

</form>

{% if mixed %}

<div class="result" style="background:{{mixed}};">

<h2>{{mixed}}</h2>

</div>

{% endif %}

</div>

</body>
</html>
